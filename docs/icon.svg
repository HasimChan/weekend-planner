<?xml version="1.0" encoding="UTF-8"?>
<!--
  Weekend Planner Logo · 2/7 时间块
  - 深蓝黑底 + 完整圆环（代表 7 天）
  - 高亮蓝色扇区 = 2/7（周末）
  - 寓意：7 天里属于你的 2 天
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 圆角方形底 -->
  <rect width="512" height="512" rx="112" fill="#0f172a"/>

  <!-- 完整灰色圆环 = 7 天 -->
  <circle cx="256" cy="256" r="164" fill="none" stroke="#334155" stroke-width="51"/>

  <!-- 高亮 2/7 扇区（蓝色，分两段叠加获得颜色层次） -->
  <!-- 扇区 1：从顶部出发，第一份 -->
  <path d="M 256 92
           A 164 164 0 0 1 402.5 168.5
           L 256 256 Z"
        fill="#3b82f6"/>
  <!-- 扇区 2：第二份，颜色稍亮 -->
  <path d="M 402.5 168.5
           A 164 164 0 0 1 402.5 343.5
           L 256 256 Z"
        fill="#60a5fa"/>
</svg>
